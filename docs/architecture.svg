<text x="1021.0" y="890" fill="#d7dbe0" font-size="13" text-anchor="start" style="white-space:pre">dedupe · topic cap</text>
<text x="1021.0" y="914" fill="#d7dbe0" font-size="13" text-anchor="start" style="white-space:pre">top N clips</text>
<text x="60" y="980" fill="#8b94a0" font-size="13" text-anchor="start" style="white-space:pre">Model picks sentence indices, never timestamps. A clip's score is a pure function of its stored answers.</text>
<text x="60" y="1004" fill="#8b94a0" font-size="13" text-anchor="start" style="white-space:pre">Failures throw before any write. Temperature 0. A pipeline hash fingerprints every prompt, rubric and weight.</text>
<text x="60" y="1028" fill="#8b94a0" font-size="13" text-anchor="start" style="white-space:pre">Feedback loop: reject reasons and trims feed per-version approval stats, compared by pipeline hash.</text>
