name: Release (macOS signed build)

# Pushing a version tag (e.g. v0.1.0) triggers a real, permanent release: the tag's version must
# match apps/desktop/package.json exactly, or the build fails before doing any signing work.
# workflow_dispatch stays available as a manual/test trigger — those runs upload a temporary
# (7-day) artifact instead of creating a release, so testing the pipeline never collides with or
# clutters actual release history.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# contents: write (elevated from the read-only default used elsewhere in this repo's workflows)
# is required for the `gh release create` step below — scoped to this workflow only.
permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Must run before `pnpm install`: better-sqlite3's own install script is
      # `prebuild-install || node-gyp rebuild --release` — if no matching prebuilt binary is
      # found, it falls back to node-gyp during install itself, which needs Python's distutils
      # (removed in 3.12+, see ci.yml for the full explanation). Usually prebuild-install
      # succeeds and this fallback never triggers, but a 3.12+ default python3 would fail
      # install outright if it ever does.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Only relevant for a real tag-triggered release — fails fast, before any of the slow
      # signing/notarization work below, if whoever pushed the tag forgot to bump package.json
      # (or bumped it to a different number than the tag says). Skipped for manual test runs,
      # which don't have a version tag to check against.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME (version $TAG_VERSION) doesn't match apps/desktop/package.json's version ($PKG_VERSION)." >&2
            echo "Bump package.json to match before tagging, or re-tag with the right version." >&2
            exit 1
          fi

      - run: bash scripts/setup-ffmpeg.sh

      # Signs but does NOT notarize (mac.notarize:false in package.json) — electron-builder's
      # built-in auto-notarize has no timeout control. We wait for the real Apple response
      # ourselves, below, with an explicit bounded timeout instead.
      - name: Build + sign dmg/zip
        run: pnpm --filter @video-editor/desktop package:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Submit for notarization
        run: bash scripts/notarize-submit.sh
        working-directory: apps/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Read submission id
        id: submission
        working-directory: apps/desktop
        run: |
          echo "id=$(python3 -c "import json; print(json.load(open('release/.notarize-state.json'))['submissionId'])")" >> "$GITHUB_OUTPUT"

      # Bounded wait, not electron-builder's own unbounded auto-notarize. On today's actual runs
      # Apple responded within minutes, but this account has previously seen multi-day delays —
      # 45m leaves real margin over that observed normal case while still failing well short of
      # GitHub's 6-hour hard job cap. If it times out, the job fails here (submission keeps
      # processing on Apple's side regardless — check/staple it later from a local machine with
      # `bash apps/desktop/scripts/notarize-check.sh <id>`, the id is in this step's logs above).
      - name: Wait for Apple's decision (bounded, 45m)
        run: |
          xcrun notarytool wait "${{ steps.submission.outputs.id }}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --timeout 45m
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Reuses the same script proven working locally: staples the .app and .dmg, rebuilds the
      # .zip from the now-stapled .app. Only reached if `wait` above resolved to a terminal
      # status — notarize-check.sh itself fails the job (and prints Apple's log) if that status
      # was Invalid/Rejected rather than Accepted.
      - name: Staple + rebuild zip
        run: bash scripts/notarize-check.sh "${{ steps.submission.outputs.id }}"
        working-directory: apps/desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Real release: pushing a version tag creates a permanent, DRAFT GitHub Release with the
      # signed/notarized dmg+zip attached. Drafts aren't visible to the public, only to repo
      # collaborators — this is still a manual publish gate: download and test the draft's
      # assets, then publish it yourself when ready (`gh release edit <tag> --draft=false`, or
      # the "Publish release" button in the GitHub UI). --generate-notes auto-fills release notes
      # from merged PRs since the previous tag, so this doubles as the changelog.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip

      # Manual/test runs (workflow_dispatch) don't create a release — a temporary artifact
      # instead, so testing the pipeline never collides with or clutters real release history.
      - name: Upload build artifact (test runs only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: clipper-mac
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          retention-days: 7
